---
services:
  kafka:
    image: apache/kafka:3.9.2
    container_name: kafka
    ports:
      - "9092:9092"
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  kafka-init-topics:
    image: apache/kafka:3.9.2
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVER: kafka:9092
    volumes:
      - ./kafka/init.sh:/init.sh:ro
    entrypoint: [ "/bin/bash", "/init.sh" ]

  redis:
    image: redis:8.6.2
    container_name: redis
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 1s
      timeout: 3s
      retries: 5
    command: [ "redis-server", "/usr/local/etc/redis/redis.conf" ]
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped

  notification-srv:
    build:
      context: ../services/notification-srv
    depends_on:
      kafka-init-topics:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: notifications
      KAFKA_GROUP_ID: notification-srv-consumer-group
      REDIS_HOST: redis
      REDIS_PORT: 6379
    env_file:
      - ../services/notification-srv/.env
    deploy:
      replicas: 3

  postgres:
    image: postgres:17-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  booking-srv:
    build:
      context: ../services/booking-srv
    container_name: booking-srv
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init-topics:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://booking:booking@postgres:5432/booking
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_NOTIFICATIONS_TOPIC: notifications
      ROAD_SRV_URL: http://road-srv:8000
      JOURNEY_SRV_URL: ""

  road-srv:
    build:
      context: ../services/road-srv
      dockerfile: Dockerfile
    depends_on: 
      redis:
        condition: service_healthy
    container_name: road-srv
    ports: 
      - "8001:8000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 1
      SERVICE_PORT: "8000"

  gateway-srv:
    build:
      context: ../services/gateway-srv
    container_name: gateway-srv
    ports:
      - "8000:8000"
    environment:
      USER_SRV_URL: http://user-srv:8000
      BOOKING_SRV_URL: http://booking-srv:8000
      NOTIFICATION_SRV_URL: ws://notification-srv:8080
      ADMIN_SRV_URL: http://admin-srv:8080

volumes:
  redis-data:
  postgres-data:
